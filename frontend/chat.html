<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Manager - Chat</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #e5ddd5; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 300px; background: white; display: flex; flex-direction: column; border-right: 1px solid #ddd; }
    .header { background: #f0f2f5; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
    .header a { text-decoration: none; color: #128c7e; font-weight: bold; }
    .conversations { flex: 1; overflow-y: auto; }
    .conversation-item { padding: 15px; border-bottom: 1px solid #f0f2f5; cursor: pointer; display: flex; justify-content: space-between; }
    .conversation-item:hover { background: #f5f6f6; }
    .conversation-item.active { background: #ebebeb; }
    .main-chat { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
    .chat-header { background: #f0f2f5; padding: 15px; border-bottom: 1px solid #ddd; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
    .message { max-width: 60%; padding: 10px; margin-bottom: 10px; border-radius: 8px; position: relative; word-wrap: break-word; }
    .message.incoming { background: white; align-self: flex-start; }
    .message.outgoing { background: #dcf8c6; align-self: flex-end; }
    .message .time { font-size: 11px; color: #999; text-align: right; margin-top: 5px; }
    .chat-input { background: #f0f2f5; padding: 15px; display: flex; align-items: center; }
    .chat-input input { flex: 1; padding: 12px; border: none; border-radius: 20px; outline: none; margin-right: 10px; font-size: 15px; }
    .chat-input button { background: #128c7e; color: white; border: none; padding: 12px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .chat-input button:hover { background: #0b7366; }
    .badge { background: #25d366; color: white; padding: 2px 6px; border-radius: 10px; font-size: 12px; }
  </style>
</head>
<body>
  
  <div class="sidebar">
    <div class="header">
      <a href="/index.html">← Voltar</a>
      <strong>Conversas</strong>
    </div>
    <div class="conversations" id="conv-list">
      <div style="padding: 15px; text-align: center; color: #888;">Carregando...</div>
    </div>
  </div>

  <div class="main-chat" id="chat-area">
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">
      Selecione uma conversa para iniciar
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    if (!api.getToken()) window.location.href = '/login.html';

    let currentConversationId = null;
    let currentContactId = null;
    let currentInstanceId = null;
    const socket = io();

    async function loadConversations() {
      const res = await api.request('/conversations');
      const list = document.getElementById('conv-list');
      if (res && res.success) {
        list.innerHTML = '';
        if (res.data.length === 0) {
          list.innerHTML = '<div style="padding:15px;text-align:center;">Nenhuma conversa.</div>';
          return;
        }
        res.data.forEach(conv => {
          const isUnread = conv.unread_count > 0;
          list.innerHTML += `
            <div class="conversation-item ${conv.id === currentConversationId ? 'active' : ''}" onclick="openChat(${conv.id}, ${conv.contact_id}, ${conv.instance_id}, '${conv.contact.name}')">
              <div>
                <strong style="${isUnread ? 'color:black;' : 'color:#555;'}">${conv.contact.name}</strong><br>
                <small style="color:#999;">${conv.last_message || ''}</small>
              </div>
              <div>
                ${isUnread ? `<span class="badge">${conv.unread_count}</span>` : ''}
              </div>
            </div>
          `;
        });
      }
    }

    async function openChat(convId, contactId, instanceId, contactName) {
      currentConversationId = convId;
      currentContactId = contactId;
      currentInstanceId = instanceId;

      const chatArea = document.getElementById('chat-area');
      chatArea.innerHTML = `
        <div class="chat-header">
          <strong>${contactName}</strong>
        </div>
        <div class="chat-messages" id="messages-container">
          <div style="text-align:center;color:#888;">Carregando...</div>
        </div>
        <div class="chat-input">
          <input type="text" id="msg-input" placeholder="Digite uma mensagem" onkeypress="handleKey(event)">
          <button onclick="sendMessage()">Enviar</button>
        </div>
      `;

      // mark as read
      await api.request(`/conversations/${convId}/read`, { method: 'POST' });

      // load messages
      const res = await api.request(`/messages?conversationId=${convId}`);
      const msgContainer = document.getElementById('messages-container');
      if (res && res.success) {
        msgContainer.innerHTML = '';
        res.data.forEach(msg => {
          appendMessageUI(msg);
        });
        scrollToBottom();
      }
      
      loadConversations(); // refresh list to clear badge
    }

    function appendMessageUI(msg) {
      const msgContainer = document.getElementById('messages-container');
      if (!msgContainer) return;
      const cssClass = msg.direction === 'OUTGOING' ? 'outgoing' : 'incoming';
      const time = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      msgContainer.innerHTML += `
        <div class="message ${cssClass}">
          ${msg.body}
          <div class="time">${time}</div>
        </div>
      `;
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      if (container) container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !currentConversationId) return;

      input.value = '';

      try {
        const res = await api.request('/messages/send', {
          method: 'POST',
          body: JSON.stringify({
            instance_id: currentInstanceId,
            contact_id: currentContactId,
            body: text
          })
        });
        if (!res.success) {
          alert(res.error.message);
        }
      } catch (e) {
        alert('Erro ao enviar');
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    // Socket listeners
    socket.on('message:new', (msg) => {
      if (msg.conversation_id === currentConversationId) {
        appendMessageUI(msg);
        scrollToBottom();
        // Mark read if chat is open
        api.request(`/conversations/${currentConversationId}/read`, { method: 'POST' });
      }
      loadConversations();
    });

    socket.on('message:sent', (msg) => {
      if (msg.conversation_id === currentConversationId) {
        appendMessageUI(msg);
        scrollToBottom();
      }
      loadConversations();
    });

    socket.on('conversation:update', () => {
      loadConversations();
    });

    window.onload = loadConversations;
  </script>
</body>
</html>
